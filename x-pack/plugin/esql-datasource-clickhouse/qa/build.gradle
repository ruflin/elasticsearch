apply plugin: 'elasticsearch.internal-java-rest-test'

dependencies {
  javaRestTestImplementation project(xpackModule('esql'))
  javaRestTestImplementation project(xpackModule('esql-core'))

  // The ClickHouse datasource plugin under test.
  clusterPlugins project(xpackModule('esql-datasource-clickhouse'))
}

tasks.named('javaRestTest') {
  // The external-datasources API only exists in snapshot builds (feature-flagged), so the IT is
  // gated on the snapshot distribution. The default distribution is required because the
  // esql-datasource-clickhouse plugin extends x-pack-esql, which is only in the default distribution.
  usesDefaultDistribution("esql external data sources require the default distribution and snapshot build")
  enabled = buildParams.snapshotBuild
  maxParallelForks = 1

  // The end-to-end test reaches out to a live ClickHouse over HTTP; allow generous timeouts.
  systemProperty 'tests.rest.client_timeout', '60'
  systemProperty 'tests.rest.socket_timeout', '60'

  // Pass the ClickHouse URL through to the test so it can self-skip when no server is configured.
  nonInputProperties.systemProperty 'tests.clickhouse.url', providers.environmentVariable('CLICKHOUSE_URL').orElse('')
}
