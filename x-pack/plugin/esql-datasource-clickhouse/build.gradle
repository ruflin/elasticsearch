apply plugin: 'elasticsearch.internal-es-plugin'
apply plugin: 'elasticsearch.internal-test-artifact'
apply plugin: 'elasticsearch.publish'
apply plugin: 'elasticsearch.esql-release'

esplugin {
  name = 'esql-datasource-clickhouse'
  description = 'ClickHouse connector support for ESQL external data sources'
  classname = 'org.elasticsearch.xpack.esql.datasource.clickhouse.ClickHouseDataSourcePlugin'
  extendedPlugins = ['x-pack-esql']
}

base {
  archivesName = 'esql-datasource-clickhouse'
}

dependencies {
  compileOnly project(path: xpackModule('esql'))
  compileOnly project(path: xpackModule('esql-core'))
  compileOnly project(path: xpackModule('core'))
  compileOnly project(':server')
  compileOnly project(xpackModule('esql:compute'))

  // Jackson is provided by the server / x-pack-esql classloader. Compile against it only so the
  // plugin does not bundle a second copy (jar hell + license check).
  compileOnly "com.fasterxml.jackson.core:jackson-core:${versions.jackson}"

  testImplementation project(':test:framework')
  testImplementation(testArtifact(project(xpackModule('core'))))
  testImplementation project(xpackModule('esql'))
  testImplementation project(xpackModule('esql-core'))
  testImplementation project(xpackModule('esql:compute'))
  testImplementation project(xpackModule('esql:qa:testFixtures'))
}
